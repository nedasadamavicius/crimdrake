<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="google-site-verification" content="GWsGTLZKYe2Tsz-P-R19O5Iw_IKQ3-94JtJ1x-kAvlQ" />

    <link rel="icon" type="image/png" href="crimdrake_logo.png">
    <title>Crimdrake</title>
    <link rel="stylesheet" href="style.css">

    <style>
        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.035);
                opacity: 0.9;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .text-box {
            cursor: pointer;
            animation: pulse 2.2s ease-in-out infinite;
        }

        /* stop pulsing when user interacts */
        .text-box:active,
        .text-box:hover {
            animation-play-state: paused;
        }

        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            color: #fff;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            z-index: 1000;
        }

        .popup.show {
            display: block;
        }
    </style>
</head>
<body>
    <header></header>
    <nav>
        <div>
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
    
    <main>
        <div class="overlay"></div> <!-- Dark overlay for better contrast -->
        <div class="text-box" id="cta">
            <h1 class="welcome-text">Crimdrake</h1>
            <p class="sub-text">A concept</p>
        </div>
    </main>

    <div class="popup" id="popup">
        A personal project, that's a list of projects.
        <br><br>Like the babushka doll of websites.
    </div>
    
    <footer>
        &copy; 2025 Crimdrake. All rights reserved. Crimdrake is a personal project and is not a registered business.
    </footer>

    
    <script>
        const logo = document.getElementById("cta");
        const popup = document.getElementById("popup");

        logo.addEventListener("click", (e) => {
            e.stopPropagation();
            popup.classList.toggle("show");
        });

        document.addEventListener("click", () => {
            popup.classList.remove("show");
        });
    </script>
</body>
</html>
