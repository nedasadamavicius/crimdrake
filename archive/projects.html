<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="crimdrake_logo.png">
    <title>Crimdrake - Projects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header></header>
    <nav>
        <div>
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
    
    <main>
        <div class="overlay"></div>
        <div class="project-container" id="project-container">
            <div class="project-list" id="project-list"></div>
            <div class="project-details">
                <h2 id="project-title">Select a project</h2>
                <p id="project-description">Click on a project to see details here.</p>
                <a id="project-link" href="#" target="_blank" style="display: none;">Visit Project</a>
                <img id="project-image" src="" alt="Project Image" style="display: none;">
                <p id="image-error" style="display: none; color: red; font-size: 14px;">Failed to load image.</p>
            </div>
        </div>
    </main>
    
    <footer>
        &copy; 2025 Crimdrake. All rights reserved. Crimdrake is a personal project and is not a registered business.
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch('projects.json')
                .then(response => response.json())
                .then(data => {
                    const projectList = document.getElementById('project-list');
                    projectList.innerHTML = "";
        
                    if (data.length === 0) {
                        document.getElementById('project-title').textContent = "No projects available";
                        document.getElementById('project-description').textContent = "Currently, there are no projects to display.";
                        return;
                    }
        
                    data.forEach(project => {
                        let projectItem = document.createElement("div");
                        projectItem.classList.add("project-item");
                        projectItem.textContent = project.title;
                        projectItem.onclick = () => loadProject(project);
                        projectList.appendChild(projectItem);
                    });
                })
                .catch(error => {
                    console.error("Error fetching projects:", error);
                    document.getElementById('project-title').textContent = "Error loading projects";
                    document.getElementById('project-description').textContent = "Failed to fetch project data. Please try again later.";
                });
        });
        
        function loadProject(project) {
            document.getElementById('project-title').textContent = project.title;
            document.getElementById('project-description').innerHTML = project.description.replace(/\n/g, '<br>');

            const linkElement = document.getElementById('project-link');

            // Hide the link if it's empty, null, or "#"
            if (project.link && project.link.trim() !== "" && project.link !== "#") {
                linkElement.href = project.link;
                linkElement.style.display = 'inline-block';
                linkElement.textContent = 'Visit ' + project.title;
            } else {
                linkElement.style.display = 'none'; // Hide link completely
            }

            const imageElement = document.getElementById('project-image');
            const errorText = document.getElementById('image-error'); // Error message placeholder

            if (project.image && project.image.trim() !== "") {
                imageElement.style.display = 'none'; // Hide by default until load success
                errorText.style.display = 'none'; // Hide error by default

                imageElement.onload = function() {
                    imageElement.style.display = 'block'; // Show only if it loads
                    errorText.style.display = 'none';
                };

                imageElement.onerror = function() {
                    console.warn("Image not found:", project.image);
                    imageElement.style.display = 'none'; // Make sure it's hidden
                    errorText.style.display = 'block';
                };

                imageElement.src = project.image; // Trigger load
            } else {
                imageElement.style.display = 'none';
                errorText.style.display = 'none';
            }
        }
    </script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.innerWidth > 768) return; // Only run on mobile
    
      fetch("projects.json")
        .then((response) => response.json())
        .then((data) => {
          const container = document.getElementById("project-list");
          container.innerHTML = "";
    
          data.forEach((project, index) => {
            const item = document.createElement("div");
            item.classList.add("project-item");
            item.textContent = project.title;
    
            const details = document.createElement("div");
            details.classList.add("project-details");
    
            details.innerHTML = `
                <p>${project.description.replace(/\n/g, "<br>")}</p>
                ${project.link && project.link.trim() !== "" && project.link !== "#" 
                    ? `<a id="project-link" href="${project.link}" target="_blank">Visit ${project.title}</a>` 
                    : ""}
                ${project.image ? `<img src="${project.image}" alt="Project Image">` : ""}
            `;
    
            item.addEventListener("click", () => {
              document.querySelectorAll(".project-details").forEach((d) => {
                if (d !== details) d.classList.remove("show");
              });
              details.classList.toggle("show");
            });
    
            const wrapper = document.createElement("div");
            wrapper.appendChild(item);
            wrapper.appendChild(details);
            container.appendChild(wrapper);
          });
        });
    });
    </script>
    
</body>
</html>
