<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="crimdrake_logo.png">
    <title>Crimdrake - Contact</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: grid;
            grid-template-rows: auto 1fr auto;
            grid-template-columns: 1fr;
            min-height: 100vh;
        }

        header {
            display: none;
        }

        nav {
            grid-row: 1;
            grid-column: 1;
            background-color: rgb(9, 0, 0);
            color: rgb(217, 217, 217);
            padding: 10px 20px;
            display: flex;
            justify-content: center;
        }

        nav a {
            color: rgb(217, 217, 217);
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Background container */
        main {
            position: relative;
            grid-row: 2;
            grid-column: 1;
            background-image: url('35b2006f-48a4-4801-bdd2-19b76c5085cc.png'); /* Background image */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Dark overlay to improve contrast */
        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* 50% black overlay */
        }

        /* Glassmorphism effect for text */
        .text-box {
            position: relative;
            background: rgba(0, 0, 0, 0.4); /* Semi-transparent */
            padding: 20px 40px;
            border-radius: 10px;
            backdrop-filter: blur(10px); /* Blur effect */
            text-align: center;
        }

        .welcome-text {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            color: rgb(255, 255, 255);
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8); /* Text glow */
        }

        .sub-text {
            font-size: 20px;
            color: rgb(255, 255, 255);
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
        }

        footer {
            grid-row: 3;
            grid-column: 1;
            background-color: rgb(9, 0, 0);
            color: rgb(217, 217, 217);
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header></header>
    <nav>
        <div>
            <a href="/">Home</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
    
    <main>
        <div class="overlay"></div> <!-- Dark overlay for better contrast -->
        <div class="text-box">
            <h1 class="welcome-text">Crimdrake</h1>
            <p class="sub-text">A concept</p>
        </div>
    </main>
    
    <footer>
        &copy; 2025 Crimdrake. All rights reserved. Crimdrake is a personal project and is not a registered business.        
    </footer>
</body>
</html>
