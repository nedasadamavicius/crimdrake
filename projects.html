<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="crimdrake_logo.png">
    <title>Crimdrake - Projects</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: grid;
            grid-template-rows: auto 1fr auto;
            grid-template-columns: 1fr;
            min-height: 100vh;
        }

        header {
            display: none;
        }

        nav {
            grid-row: 1;
            grid-column: 1;
            background-color: rgb(9, 0, 0);
            color: rgb(217, 217, 217);
            padding: 10px 20px;
            display: flex;
            justify-content: center;
        }

        nav a {
            color: rgb(217, 217, 217);
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Background container */
        main {
            position: relative;
            grid-row: 2;
            grid-column: 1;
            background-image: url('35b2006f-48a4-4801-bdd2-19b76c5085cc.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Dark overlay covering full main */
        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        /* Project container covering 90% of main */
        .project-container {
            position: relative;
            width: 90%;
            height: 90%;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            display: grid;
            grid-template-columns: 1fr 2fr;
            padding: 20px;
            gap: 20px;
            color: white;
        }

        .project-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-right: 10px;
            max-height: 100%;
        }

        .project-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .project-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .project-details {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
            width: 100%;
            height: 100%;
        }

        #project-link {
            font-size: 18px;
            font-weight: bold;
            color: cyan;
            text-decoration: none;
        }

        #project-link:hover {
            text-decoration: underline;
        }

        #project-image {
            width: 100%;
            max-height: auto; /* Maintain aspect ratio */
            object-fit: contain;
            border-radius: 5px;
            display: none;
        }

        .project-details h2 {
            margin-bottom: 10px;
        }

        footer {
            grid-row: 3;
            grid-column: 1;
            background-color: rgb(9, 0, 0);
            color: rgb(217, 217, 217);
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header></header>
    <nav>
        <div>
            <a href="/">Home</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
    
    <main>
        <div class="overlay"></div>
        <div class="project-container">
            <div class="project-list" id="project-list"></div>
            <div class="project-details">
                <h2 id="project-title">Select a project</h2>
                <p id="project-description">Click on a project to see details here.</p>
                <a id="project-link" href="#" target="_blank" style="display: none;">Visit Project</a>
                <img id="project-image" src="" alt="Project Image" style="display: none;">
                <p id="image-error" style="display: none; color: red; font-size: 14px;">Failed to load image.</p>
            </div>
        </div>
    </main>
    
    <footer>
        &copy; 2025 Crimdrake. All rights reserved. Crimdrake is a personal project and is not a registered business.
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch('projects.json')
                .then(response => response.json())
                .then(data => {
                    const projectList = document.getElementById('project-list');
                    projectList.innerHTML = "";
        
                    if (data.length === 0) {
                        document.getElementById('project-title').textContent = "No projects available";
                        document.getElementById('project-description').textContent = "Currently, there are no projects to display.";
                        return;
                    }
        
                    data.forEach(project => {
                        let projectItem = document.createElement("div");
                        projectItem.classList.add("project-item");
                        projectItem.textContent = project.title;
                        projectItem.onclick = () => loadProject(project);
                        projectList.appendChild(projectItem);
                    });
                })
                .catch(error => {
                    console.error("Error fetching projects:", error);
                    document.getElementById('project-title').textContent = "Error loading projects";
                    document.getElementById('project-description').textContent = "Failed to fetch project data. Please try again later.";
                });
        });
        
        function loadProject(project) {
            document.getElementById('project-title').textContent = project.title;
            document.getElementById('project-description').textContent = project.description;

            const linkElement = document.getElementById('project-link');

            // Hide the link if it's empty, null, or "#"
            if (project.link && project.link.trim() !== "" && project.link !== "#") {
                linkElement.href = project.link;
                linkElement.style.display = 'inline-block';
                linkElement.textContent = 'Visit ' + project.title;
            } else {
                linkElement.style.display = 'none'; // Hide link completely
            }

            const imageElement = document.getElementById('project-image');
            const errorText = document.getElementById('image-error'); // Error message placeholder

            if (project.image && project.image.trim() !== "") {
                imageElement.src = project.image;
                imageElement.style.display = 'block';
                errorText.style.display = 'none'; // Hide error text if image loads successfully

                // Handle missing or broken images
                imageElement.onerror = function() {
                    console.warn("Image not found:", project.image);
                    imageElement.style.display = 'none'; // Hide broken image
                    errorText.style.display = 'block'; // Show error text
                };
            } else {
                imageElement.style.display = 'none'; // Hide image completely
                errorText.style.display = 'none'; // Don't show error for empty/null images
            }
        }
        </script>
</body>
</html>
